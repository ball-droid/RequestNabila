<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>From Nabila</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="background"></div>
    <div class="celebration" id="celebration" aria-hidden="true"></div>

    <div class="scene">
      <div class="shadow"></div>

      <div class="envelope" id="envelope">
        <!-- Back -->
        <div class="back"></div>

        <!-- Letter -->
        <div class="letter-wrapper">
          <div class="letter">
            <div class="paper">
              <!-- Left -->
              <section class="panel left">
                <div class="inside">
                  <h2>For My Friend</h2>

                  <p>
                   Selamat atas amanah barunya sebagai Wakabem! 🎉
                  </p>
                </div>
              </section>

              <!-- Center -->

              <section class="panel center">
                <div class="cover">

                  <h1>From</h1>

                  <h2>Nabila</h2>

                  <div class="heart">❤</div>
                </div>
              </section>

              <!-- Right -->

              <section class="panel right">
                <div class="inside">

                  <p>
                      Semoga selalu dimudahkan dalam setiap langkahnya dan bisa membawa banyak hal baik untuk BEM ke depannya.
                  </p>
                </div>
              </section>
            </div>
          </div>
        </div>

        <!-- Pocket -->

        <div class="pocket">
          <div class="left-fold"></div>

          <div class="right-fold"></div>
        </div>

        <!-- Flap -->

        <div class="flap">
          <div class="seal">❤</div>
        </div>
      </div>
    </div>

    <div class="hint" id="hint">Tap the Envelope</div>

    <script src="script.js"></script>
  </body>
</html>
